    controller-gen.kubebuilder.io/version: v0.22.0
  name: hubhttproutes.gateway.kubehub.io
spec:
  group: gateway.kubehub.io
  names:
    categories:
    - gateway-api
    kind: HubHttpRoute
    listKind: HubHttpRouteList
    plural: hubhttproutes
    singular: hubhttproute
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
