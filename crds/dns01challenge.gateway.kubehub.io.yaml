apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: dns01challenges.gateway.kubehub.io
spec:
  group: gateway.kubehub.io
  names:
    kind: DNS01Challenge
    listKind: DNS01ChallengeList
    plural: dns01challenges
    singular: dns01challenge
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .spec.dnsName
      name: DNSName
      type: string
    - jsonPath: .status.conditions[?(@.type=='Processed')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DNS01Challenge carries one ACME DNS-01 challenge from the cert-manager
          webhook to the controller that writes the TXT record.

          The object is intentionally a thin transport. It holds the fields the
          cert-manager ChallengeRequest exposes and nothing else, so the webhook that
          writes it does not need to know about the cluster or the DNS zone.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              action:
                description: Action selects whether the record is written or removed.
                enum:
                - Present
                - CleanUp
                type: string
              dnsName:
                description: DNSName is the challenge DNS name cert-manager asked
                  about.
                minLength: 1
                type: string
              key:
                description: Key is the TXT record value.
                type: string
              resolvedFQDN:
                description: |-
                  ResolvedFQDN is the fully qualified record name. It is always below
                  _acme-challenge. and the configured DNS zone.
                minLength: 1
                type: string
              resolvedZone:
                description: ResolvedZone is the DNS zone cert-manager resolved the
                  name to.
                type: string
              resourceNamespace:
                description: ResourceNamespace is the namespace of the cert-manager
                  challenge.
                type: string
              uid:
                description: UID is the cert-manager challenge UID.
                type: string
            required:
            - action
            - dnsName
            - resolvedFQDN
            type: object
          status:
            properties:
              conditions:
                description: Conditions report whether the challenge record was processed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation that was last processed.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
