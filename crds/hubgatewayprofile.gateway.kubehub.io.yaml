apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: hubgatewayprofiles.gateway.kubehub.io
spec:
  group: gateway.kubehub.io
  names:
    categories:
    - gateway-api
    kind: HubGatewayProfile
    listKind: HubGatewayProfileList
    plural: hubgatewayprofiles
    singular: hubgatewayprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.exposure
      name: Exposure
      type: string
    - jsonPath: .spec.endpoint.type
      name: Endpoint
      type: string
    - jsonPath: .status.endpoint.addresses[0]
      name: Address
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HubGatewayProfile provisions the network endpoint of a Gateway API Gateway.
          It does not replace Gateway API resources: users attach their own HTTPRoute
          resources to the Gateway this profile manages.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              endpoint:
                description: Endpoint describes how the endpoint is provisioned.
                properties:
                  address:
                    description: |-
                      Address is the endpoint address. It is required for L2Announcement and
                      PublicIP endpoints. A Local HostPort endpoint may
                      leave it empty to discover the designated Gateway node's address.
                    format: ipv4
                    type: string
                  type:
                    description: |-
                      Type selects the endpoint implementation. PublicIP is for an existing
                      public IP: configure port-forward 443 to nodePort 443. In a HomeSetup,
                      forward router port 443 to NodePort 443; in a CloudSetup, forward vNet
                      port 443 to NodePort 443.
                    enum:
                    - HostPort
                    - L2Announcement
                    - PublicIP
                    type: string
                required:
                - type
                type: object
              exposure:
                description: Exposure selects the network the endpoint is reachable
                  from.
                enum:
                - Local
                - Internet
                type: string
              l2Announcement:
                default:
                  autoCreate: true
                description: |-
                  L2Announcement configures optional behavior for L2Announcement endpoints.
                  When omitted, autoCreate defaults to true.
                properties:
                  autoCreate:
                    default: true
                    description: |-
                      AutoCreate creates a single-IP CiliumLoadBalancerIPPool when no usable
                      pool contains the endpoint address. It defaults to true.
                    type: boolean
                type: object
              letsEncrypt:
                description: |-
                  LetsEncrypt configures the Let's Encrypt environment used to issue the
                  wildcard certificate. It is optional and defaults to production.
                properties:
                  email:
                    description: Email is the optional ACME account email used for
                      expiry notifications.
                    format: email
                    type: string
                  env:
                    default: prod
                    description: Env selects the Let's Encrypt ACME environment. It
                      defaults to prod.
                    enum:
                    - prod
                    - staging
                    type: string
                type: object
            required:
            - endpoint
            - exposure
            type: object
            x-kubernetes-validations:
            - message: Internet exposure does not support L2Announcement
              rule: '!(self.exposure == ''Internet'' && self.endpoint.type == ''L2Announcement'')'
            - message: address is required for a Local L2Announcement endpoint
              rule: '!(self.exposure == ''Local'' && self.endpoint.type == ''L2Announcement'')
                || (has(self.endpoint.address) && size(self.endpoint.address) > 0)'
            - message: address is required for an Internet HostPort endpoint
              rule: '!(self.exposure == ''Internet'' && self.endpoint.type == ''HostPort'')
                || (has(self.endpoint.address) && size(self.endpoint.address) > 0)'
            - message: PublicIP requires Internet exposure and an address
              rule: '!(self.endpoint.type == ''PublicIP'') || (self.exposure == ''Internet''
                && has(self.endpoint.address) && size(self.endpoint.address) > 0)'
          status:
            properties:
              conditions:
                description: |-
                  Conditions report the consolidated state of the profile. The condition
                  types are Ready, GatewayReady, DNSReady, and CertificateReady. Ready uses
                  Ready, Reconciling, or Failed; GatewayReady uses Provisioned, Pending,
                  InvalidConfiguration, or ProvisioningFailed; DNSReady uses
                  RecordsPublished, Pending, or PublishingFailed; CertificateReady uses
                  Issued, Pending, or IssuingFailed as reasons.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dnsNames:
                description: |-
                  DNSNames are the wildcard names users can use to reach applications on
                  the Gateway. There is at most one name per profile.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              endpoint:
                description: Endpoint is the resolved network endpoint.
                properties:
                  addresses:
                    description: Addresses are the resolved endpoint addresses.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation that was last processed.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
